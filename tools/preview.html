<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>换汇查查 · 本地视觉预览</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #eef2f1; color: #17323a; font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif; }
  .phone { width: 420px; margin: 18px auto; background: #fff; border-radius: 26px; padding: 18px 16px 22px; box-shadow: 0 18px 50px rgba(20, 60, 50, .16); }
  .eyebrow { font-size: 10px; letter-spacing: .16em; color: #7b8e96; text-transform: uppercase; }
  h1 { font-size: 22px; margin: 4px 0 2px; letter-spacing: .02em; }
  .subtitle { font-size: 11px; color: #7b8e96; margin-bottom: 12px; }
  .chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: 0 0 auto; font-size: 12px; padding: 5px 10px; border-radius: 13px; background: #eef4f3; color: #2c4a4f; cursor: pointer; white-space: nowrap; }
  .chip.active { background: #11695c; color: #fff; }
  .ranges { display: flex; gap: 14px; font-size: 12px; color: #7b8e96; margin: 12px 0 4px; }
  .ranges span { cursor: pointer; padding: 2px 0; }
  .ranges span.active { color: #11695c; font-weight: 600; border-bottom: 2px solid #11695c; }
  .card { background: #f7faf9; border-radius: 14px; padding: 12px; margin: 8px 0; }
  .quoteTop { display: flex; align-items: baseline; justify-content: space-between; }
  .quoteLabel { font-size: 12px; color: #5b6b73; }
  .quoteTop .tag { font-size: 10px; color: #11695c; background: #e2efe9; border-radius: 8px; padding: 2px 6px; }
  .price { font-size: 30px; font-weight: 600; margin: 4px 0 0; }
  .price small { font-size: 12px; color: #7b8e96; font-weight: 400; }
  .muted { font-size: 11px; color: #7b8e96; margin-top: 4px; }
  .chart { width: 100%; height: 252px; }
  .toggle { margin: 10px 0 2px; width: 100%; border: 1px solid #d6e4e0; background: #f4f8f6; color: #11695c; border-radius: 10px; padding: 8px; font-size: 12px; cursor: pointer; }
  table { width: 100%; border-collapse: collapse; font-size: 11px; margin-top: 10px; }
  th { color: #7b8e96; font-weight: 500; text-align: right; padding: 4px; }
  th:first-child, td:first-child { text-align: left; }
  td { padding: 7px 4px; border-top: 1px solid #eef2f1; text-align: right; font-variant-numeric: tabular-nums; }
  .sw { display: inline-block; width: 12px; height: 3px; border-radius: 2px; margin-right: 6px; vertical-align: middle; }
  .down { color: #c0392b; } .up { color: #1e8e3e; } .staleTag { color: #c0392b; }
</style>
</head>
<body>
<div class="phone">
  <div class="eyebrow" id="eyebrow">BOC / SINA · USD / CNY</div>
  <h1>美元结汇观察</h1>
  <div class="subtitle">本地视觉预览 · 与小程序共用同一个 ECharts option</div>
  <div class="chips" id="pairs"></div>
  <div class="ranges" id="ranges"></div>
  <div class="card">
    <div class="quoteTop"><span class="quoteLabel" id="quoteLabel">中行现汇买入</span><span class="tag" id="quoteTag">结汇参考</span></div>
    <div class="price" id="quotePrice">—<small> 元</small></div>
    <div class="muted" id="quoteMeta">1 外币兑人民币 · 每 30 秒检查更新</div>
  </div>
  <div class="chart" id="chart"></div>
  <button class="toggle" id="reverse">反向换算：1 人民币 = ? 外币</button>
  <table>
    <thead><tr><th>来源</th><th>最新价</th><th>涨跌</th><th>时间</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <div class="muted" id="foot">数据仅用于本地视觉验证，非实时投资参考</div>
</div>
<script src="../miniprogram/components/ec-canvas/echarts.js"></script>
<script src="../miniprogram/utils/chart-option.js"></script>
<script>
(function () {
  var state = { pair: 'USD', pairLabel: '美元', range: '1d', reverse: false, token: null, pairs: [], chart: null, table: null };
  var RANGES = ChartOption.RANGES;

  var chart = echarts.init(document.getElementById('chart'), null, { renderer: 'canvas' });

  function api(path, options) {
    options = options || {};
    var headers = { 'Content-Type': 'application/json' };
    if (state.token) headers.Authorization = 'Bearer ' + state.token;
    return fetch(path, { method: options.method || 'GET', headers: headers, body: options.body ? JSON.stringify(options.body) : undefined })
      .then(function (response) { return response.json().then(function (data) { if (!response.ok) throw new Error(data.error || response.status); return data; }); });
  }

  function isoBefore(days) {
    return new Date(Date.now() - days * 86400000).toISOString();
  }

  function fmt(value, digits) { return value === null || value === undefined ? '—' : Number(value).toFixed(digits); }

  function renderPairs() {
    var box = document.getElementById('pairs');
    box.innerHTML = '';
    state.pairs.forEach(function (item) {
      var chip = document.createElement('span');
      chip.className = 'chip' + (item.pair === state.pair ? ' active' : '');
      chip.textContent = item.pair;
      chip.onclick = function () { state.pair = item.pair; state.pairLabel = item.label; renderPairs(); refresh(); };
      box.appendChild(chip);
    });
  }

  function renderRanges() {
    var box = document.getElementById('ranges');
    box.innerHTML = '';
    RANGES.forEach(function (range) {
      var span = document.createElement('span');
      span.className = range.id === state.range ? 'active' : '';
      span.textContent = range.label;
      span.onclick = function () { state.range = range.id; renderRanges(); refresh(); };
      box.appendChild(span);
    });
  }

  function rangeConfig() {
    for (var i = 0; i < RANGES.length; i++) if (RANGES[i].id === state.range) return RANGES[i];
    return RANGES[0];
  }

  function renderTable() {
    var rows = (state.table && state.table.sources) || [];
    var body = document.getElementById('rows');
    body.innerHTML = '';
    var primary = null;
    rows.forEach(function (row) {
      if (!primary && row.price !== null) primary = row;
      var tr = document.createElement('tr');
      var price = row.price === null ? '—' : fmt(state.reverse ? 1 / row.price : row.price, state.reverse ? 6 : 4);
      var change = row.change === null ? '—' : fmt(state.reverse ? (1 / (row.price)) - (1 / (row.price - row.change)) : row.change, state.reverse ? 6 : 4);
      var cls = row.change === null ? '' : (row.change > 0 ? 'up' : row.change < 0 ? 'down' : '');
      tr.innerHTML = '<td><span class="sw" style="background:' + row.color + '"></span>' + row.label + '</td>' +
        '<td>' + price + '</td>' +
        '<td class="' + cls + '">' + change + '</td>' +
        '<td class="' + (row.stale ? 'staleTag' : '') + '">' + (row.stamp ? row.stamp.slice(5, 16).replace('T', ' ') : '—') + '</td>';
      body.appendChild(tr);
    });
    if (primary) {
      document.getElementById('quoteLabel').textContent = primary.label + ' · ' + state.pairLabel;
      var display = state.reverse ? fmt(1 / primary.price, 6) : fmt(primary.price, 4);
      document.getElementById('quotePrice').innerHTML = display + '<small> ' + (state.reverse ? '外币' : '元') + '</small>';
      document.getElementById('quoteMeta').textContent = '1 ' + (state.reverse ? '人民币 = ' + display + ' ' + state.pair : state.pair + ' = ' + display + ' 人民币') + ' · 每 30 秒检查更新';
      document.getElementById('quoteTag').textContent = primary.stale ? '报价过期' : '结汇参考';
    }
    document.getElementById('eyebrow').textContent = (state.pair === 'USD' ? 'BOC / SINA' : 'BOC / SINA') + ' · ' + state.pair + ' / CNY';
  }

  function renderChart(data) {
    var config = rangeConfig();
    var baseline = null;
    if (data.series && data.series.length) {
      var first = data.series[0];
      var quote = state.table && state.table.sources.filter(function (row) { return row.price !== null; })[0];
      if (quote && quote.change !== null) baseline = quote.price - quote.change;
    }
    chart.setOption(ChartOption.buildOption({
      buckets: data.buckets, series: data.series, interval: config.interval,
      reverse: state.reverse, baseline: baseline
    }), true);
  }

  function refresh() {
    var config = rangeConfig();
    return Promise.all([
      api('/api/table?pair=' + state.pair),
      api('/api/chart?pair=' + state.pair + '&start=' + encodeURIComponent(isoBefore(config.days)) + '&end=' + encodeURIComponent(new Date().toISOString()) + '&interval=' + config.interval)
    ]).then(function (results) {
      state.table = results[0];
      state.chartData = results[1];
      renderTable();
      renderChart(results[1]);
      document.getElementById('foot').textContent = '本地预览：' + results[0].label + ' · ' + results[1].buckets.length + ' 个时间点 · 拖动/双指缩放图表';
    }).catch(function (error) { document.getElementById('foot').textContent = '加载失败: ' + error.message; });
  }

  document.getElementById('reverse').onclick = function () {
    state.reverse = !state.reverse;
    this.textContent = state.reverse ? '正向换算：1 外币 = ? 人民币' : '反向换算：1 人民币 = ? 外币';
    renderTable();
    if (state.chartData) renderChart(state.chartData);
  };

  window.preview = {
    setPair: function (pair) { state.pair = pair; state.pairLabel = (state.pairs.filter(function (p) { return p.pair === pair; })[0] || {}).label || pair; renderPairs(); return refresh(); },
    setRange: function (range) { state.range = range; renderRanges(); return refresh(); },
    toggleReverse: function () { document.getElementById('reverse').click(); },
    applyZoom: function (start, end) { chart.dispatchAction({ type: 'dataZoom', start: start, end: end }); },
    getState: function () { return state; }
  };

  api('/api/login', { method: 'POST', body: { code: 'preview-harness' } })
    .then(function (login) { state.token = login.token; return api('/api/pairs'); })
    .then(function (data) { state.pairs = data.pairs; renderPairs(); renderRanges(); return refresh(); })
    .then(function () { window.__previewReady = true; });
})();
</script>
</body>
</html>
